<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <title>Antools.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="header__inner">
        <a class="logo">
          <img class="logo__img" src="images/logo.svg" alt="antools.">
          <p class="logo__text">antools.</p>
        </a>
        <nav class="menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#!">Home </a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#!">Categories 
                <span class="icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path d="M4.5 6.75L9 11.25L13.5 6.75" stroke="white" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
              </a> 
              <ul class="menu__categories-item">
                <li><a class="menu__categories-link" href="#!">Design</a></li>
                <li><a class="menu__categories-link" href="#!">Development</a></li>
              </ul>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#!">My Collections</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#!">Blog</a>
            </li>
          </ul>
        </nav>
        <div class="login__menu">
          <a class="login__link" href="#!">Login</a>
          <a class="sign-up__link" href="#!">Sign Up</a>
        </div>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="hero">
      <div class="container">
        <div class="hero__inner">
          <h1 class="hero__title">
            Awesome tools for Designer & Developer<span>.</span>
          </h1>
          <p class="hero__text">
            Antool is a web collection of information on paid or free Design and Development tools
          </p>
          <form class="search" action="#">
            <span>
              <img class="search__icon" src="images/search-icon.svg" alt="search-icon">
            </span>
            <input class="search__input" type="search" placeholder="find more than 430+ tools...">
            <button class="search__btn" type="submit">Search</button>
          </form>
          <ul class="hero__social">
            <li class="hero__social-item">
              <a class="hero__social-link" href="">
                <img href="#" src="images/facebook.svg" alt="facebook">
              </a>
            </li>
            <li class="hero__social-item">
              <a class="hero__social-link" href="">
                <img href="#" src="images/instagram.svg" alt="instagram">
              </a>
            </li>
            <li class="hero__social-item">
              <a class="hero__social-link" href="">
                <img href="#" src="images/twitter.svg" alt="twitter">
              </a>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
